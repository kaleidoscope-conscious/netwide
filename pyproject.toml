[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netwide"
version = "4.7.0"
description = "Netwide — Sovereign Network Intelligence, 802.11 TSF De-Cloaking, Wire DPI & Active Countermeasures Suite"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Netwide-Commercial"
license-files = ["LICENSE.md"]
authors = [
    {name = "Netwide Sovereign Engineering"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "qrcode>=7.4.2",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
netwide = "netwide.cli:main"

[tool.setuptools]
package-dir = {"netwide" = "."}
packages = ["netwide"]

[tool.setuptools.package-data]
netwide = [
    "static/*.html",
    "static/*.svg",
    "static/*.json",
    "static/*.js",
    "static/*.apk",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
