name: Netwide CI & GitHub Pages Storefront

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic rich pyflakes pytest httpx qrcode pillow cryptography

      - name: Run static analysis (pyflakes)
        run: |
          pyflakes .

      - name: Run unit & integration test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          ln -sf "${{ github.workspace }}" ../netwide
          pytest tests/ -q

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public storefront only (never publish internal docs)
        run: |
          rm -rf .pages_staging
          mkdir -p .pages_staging/assets
          cp docs/index.html docs/privacy.html docs/sitemap.xml docs/robots.txt .pages_staging/
          cp -r play_store_assets/* .pages_staging/assets/
          cp docs/assets/* .pages_staging/assets/ 2>/dev/null || true
          echo "Published files:" && ls -R .pages_staging

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./.pages_staging"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
