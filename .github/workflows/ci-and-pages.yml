name: Netwide CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic rich pyflakes pytest httpx qrcode pillow cryptography

      - name: Run static analysis (pyflakes)
        run: |
          pyflakes .

      - name: Run unit & integration test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          ln -sf "${{ github.workspace }}" ../netwide
          pytest tests/ -q
