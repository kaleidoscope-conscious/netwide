name: NetPulse CI & GitHub Pages Storefront

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic rich pyflakes pytest httpx qrcode pillow

      - name: Run static analysis (pyflakes)
        run: |
          pyflakes .

      - name: Run unit & integration test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          ln -sf "${{ github.workspace }}" ../netpulse
          pytest tests/ -q

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Copy Play Store screenshots into docs/assets
        run: |
          mkdir -p docs/assets
          cp -r play_store_assets/* docs/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
