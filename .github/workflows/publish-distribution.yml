name: Publish Distribution (GHCR · Docker Hub · PyPI)

# Runs when a GitHub release is published. Builds the container image and the
# Python wheel, then pushes them to every registry that has credentials.
#
#   GHCR      -> works out of the box (GITHUB_TOKEN, packages:write)
#   Docker Hub-> add secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
#   PyPI      -> add secret PYPI_API_TOKEN (pypi-XXXX with the repo scope)
#
# If a registry has no credentials it is skipped, not failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v4.7.0)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build wheel twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to PyPI (if token present)
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::notice::PYPI_API_TOKEN not set — skipping PyPI"
            exit 0
          fi
          python -m twine upload dist/* \
            --username __token__ \
            --password "$PYPI_API_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if credentials present)
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and push image to Docker Hub (if logged in)
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netwide:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netwide:latest

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # New GHCR packages default to private; make the image pullable without a token.
          for API in "orgs/$OWNER" "users/$OWNER"; do
            URL="https://api.github.com/$API/packages/container/netwide"
            CODE=$(curl -s -o /tmp/ghcr.json -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d '{"visibility":"public"}')
            if [ "$CODE" = "200" ]; then
              echo "GHCR package set to public via $API"
              exit 0
            fi
          done
          echo "::notice::Could not flip GHCR visibility automatically — set it in the package settings UI."

      - name: Summary
        run: |
          echo "### Published v${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: \`ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker Hub: \`${{ secrets.DOCKERHUB_USERNAME }}/netwide\` (skipped without credentials)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PyPI: \`pip install netwide\` (skipped without PYPI_API_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
