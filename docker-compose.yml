services:
  netpulse:
    build: .
    container_name: netpulse
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - path: .env
        required: false
    environment:
      # Persist the SQLite intel DB on the named volume. Mounting the volume over
      # /app/netpulse shadowed the entire package source (documented bug) — mount
      # a dedicated /data dir and point engines at it via NETPULSE_DB_PATH instead.
      - NETPULSE_DB_PATH=/data/netpulse_intel.db
    volumes:
      - netpulse_data:/data
    restart: unless-stopped

volumes:
  netpulse_data:
