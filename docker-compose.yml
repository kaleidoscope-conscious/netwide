services:
  netwide:
    build: .
    container_name: netwide
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - path: .env
        required: false
    environment:
      # Persist the SQLite intel DB on the named volume. Mounting the volume over
      # /app/netwide shadowed the entire package source (documented bug) — mount
      # a dedicated /data dir and point engines at it via NETWIDE_DB_PATH instead.
      - NETWIDE_DB_PATH=/data/netwide_intel.db
    volumes:
      - netwide_data:/data
    restart: unless-stopped

volumes:
  netwide_data:
